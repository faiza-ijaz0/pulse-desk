packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# pnpm blocks dependency lifecycle scripts unless each one is explicitly decided here;
# an undecided script fails `pnpm install` on a fresh checkout (and in CI).
allowBuilds:
  # Downloads the schema engine binary that `prisma migrate` needs.
  '@prisma/engines': true
  # Not needed: pnpm installs esbuild's platform binary package directly.
  esbuild: false
  # Only a preinstall Node-version check; the client is generated by packages/db's postinstall.
  prisma: false
