<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="PulseDesk — customer support workspace" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PulseDesk</title>
    <script>
      // Apply the saved theme before first paint to avoid a light→dark flash.
      // Must stay in sync with THEME_STORAGE_KEY / resolveTheme in src/lib/theme.tsx.
      (function () {
        try {
          var pref = localStorage.getItem('pulsedesk-theme');
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
