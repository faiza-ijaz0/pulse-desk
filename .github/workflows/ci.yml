name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulsedesk
          POSTGRES_PASSWORD: pulsedesk_ci_password
          POSTGRES_DB: pulsedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsedesk -d pulsedesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway credentials for the ephemeral CI service container only.
      TEST_DATABASE_URL: postgresql://pulsedesk:pulsedesk_ci_password@localhost:5432/pulsedesk_test
      DATABASE_URL: postgresql://pulsedesk:pulsedesk_ci_password@localhost:5432/pulsedesk

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & component tests
        run: pnpm test

      - name: Database integration tests (real PostgreSQL)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pulsedesk/e2e exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
