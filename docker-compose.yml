# Local development services only. Credentials here are throwaway dev defaults
# and must match DATABASE_URL / TEST_DATABASE_URL in your local .env.
#
# Only PostgreSQL is needed today. Redis is planned (shared rate limits, background queues,
# real-time fan-out) and will be added here when the code uses it.
name: pulsedesk

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulsedesk
      POSTGRES_PASSWORD: pulsedesk_dev_password
      POSTGRES_DB: pulsedesk
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate pulsedesk_test database used by integration tests.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulsedesk -d pulsedesk']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
